name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Nombre corto y estable: es el que se exige como required check en la
    # protección de rama. Si se renombra, hay que actualizar esa configuración.
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `test:coverage` aplica los umbrales de `vite.config.ts`: si la cobertura
      # baja, el job falla. No se usa `pnpm test` aquí a propósito.
      # `tee` guarda la salida completa: si falla, se resume en el summary del
      # job y se adjunta como artefacto, en lugar de obligar a bucear en el log.
      - name: Pruebas y cobertura
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee coverage.log

      - name: Resumen del fallo de pruebas
        if: failure()
        run: |
          {
            echo '### Falló «Pruebas y cobertura»'
            echo ''
            echo '```'
            tail -n 80 coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Además del summary, se emiten anotaciones: son visibles en la
          # pestaña Checks y legibles por API sin sesión, lo que permite
          # diagnosticar el fallo desde fuera de GitHub.
          grep -E 'ERROR|FAIL|Caused by|Error:|Cannot read|timed out' coverage.log \
            | head -n 10 \
            | while IFS= read -r line; do
                echo "::error::${line}"
              done || true

      - name: Guardar log de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: coverage.log
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Presupuesto de arranque (gzip)
        run: pnpm size

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    # Mismo criterio que quality: el nombre es parte del contrato con GitHub.
    name: e2e
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La caché evita descargar Chromium en cada ejecución.
      - name: Caché de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas end-to-end
        run: pnpm e2e
        env:
          CI: 'true'
          # Los e2e corren contra el modo mock: no hay backend en CI.
          VITE_API_MODE: mock

      - name: Guardar informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
