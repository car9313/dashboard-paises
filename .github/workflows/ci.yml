name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (types · lint · cobertura · build · presupuesto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `test:coverage` aplica los umbrales de `vite.config.ts`: si la cobertura
      # baja, el job falla. No se usa `pnpm test` aquí a propósito.
      - name: Pruebas y cobertura
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Presupuesto de arranque (gzip)
        run: pnpm size

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Chromium, modo mock)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La caché evita descargar Chromium en cada ejecución.
      - name: Caché de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas end-to-end
        run: pnpm e2e
        env:
          CI: 'true'
          # Los e2e corren contra el modo mock: no hay backend en CI.
          VITE_API_MODE: mock

      - name: Guardar informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
